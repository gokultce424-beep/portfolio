<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00d2ff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Glowing HG Monogram -->
  <text 
    x="32" 
    y="41" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="25" 
    font-weight="900" 
    letter-spacing="-1" 
    fill="url(#textGrad)" 
    text-anchor="middle"
    filter="url(#glow)"
  >HG</text>

  <!-- Cyan accent pulse dot -->
  <circle cx="49" cy="18" r="3.5" fill="#00d2ff" filter="url(#glow)" />
</svg>
