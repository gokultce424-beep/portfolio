<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Deep Dark Canvas -->
  <rect width="1200" height="630" fill="#030712" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomRight" cx="90%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowTop)" />
  <rect width="1200" height="630" fill="url(#glowBottomRight)" />

  <!-- Outer Glowing Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="url(#cyanBlueGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Logo Mark Box -->
  <rect x="90" y="90" width="68" height="68" rx="18" fill="url(#cyanBlueGrad)" />
  <rect x="92" y="92" width="64" height="64" rx="16" fill="#030712" />
  <text x="124" y="133" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="-1">HG</text>

  <!-- Brand Domain -->
  <text x="175" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold">harigokulprasad<tspan fill="#00d2ff">.dev</tspan></text>
  <text x="175" y="148" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" letter-spacing="3">PORTFOLIO</text>

  <!-- Main Headline -->
  <text x="90" y="270" fill="#ffffff" font-family="Georgia, serif" font-size="64" font-style="italic" font-weight="normal">Hey, I'm Gokul</text>
  
  <text x="90" y="345" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700">Full Stack Developer &amp; Designer</text>

  <text x="90" y="415" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="300">Engineering high-performance web applications, modern interfaces,</text>
  <text x="90" y="450" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="300">and scalable solutions that solve business tasks.</text>

  <!-- Tech Badges -->
  <g transform="translate(90, 500)">
    <rect x="0" y="0" width="100" height="38" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="50" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">React</text>

    <rect x="115" y="0" width="100" height="38" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="165" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Angular</text>

    <rect x="230" y="0" width="110" height="38" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="285" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Node.js</text>

    <rect x="355" y="0" width="130" height="38" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="420" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Spring Boot</text>

    <rect x="500" y="0" width="90" height="38" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="545" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Java</text>

    <rect x="605" y="0" width="100" height="38" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="655" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python</text>

    <rect x="720" y="0" width="140" height="38" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="790" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Tailwind CSS</text>
  </g>
</svg>
